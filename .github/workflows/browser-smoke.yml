name: Chromium browser acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install committed app dependencies
        run: npm ci
      - name: Install an exact Playwright test runner (not deployed)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-fund --no-audit playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Build app for real browser validation
        run: npm run build
      - name: Run actual Chromium interactions
        run: node tests/browser.e2e.mjs
      - name: Attach real browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phenomena-browser-shots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
