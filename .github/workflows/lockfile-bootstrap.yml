name: Temporary Lockfile Generation
on:
  push:
    branches: [chore/foundation-adoption]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Generate reproducible npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit generated lockfile for manual verification and commit
        run: |
          echo 'BEGIN_LOCKFILE_JSON'
          cat package-lock.json
          echo 'END_LOCKFILE_JSON'
